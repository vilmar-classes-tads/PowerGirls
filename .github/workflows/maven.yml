name: Maven CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar o JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar, executar testes e gerar JAR
        run: mvn clean package

      - name: Construir imagem Docker
        run: docker build -t sistema-editais:latest .

      - name: Executar container Docker
        run: docker run --rm sistema-editais:latest
