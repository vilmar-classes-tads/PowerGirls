<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - PowerGirls</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; padding: 0 1rem; }
        form { display: grid; gap: 1rem; }
        label { display: grid; gap: .35rem; }
        input { padding: .7rem; border: 1px solid #bbb; border-radius: 6px; }
        button { padding: .7rem; border: 0; border-radius: 6px; cursor: pointer; }
        .erro { color: #a00; background: #fee; padding: .8rem; border-radius: 6px; }
        .sucesso { color: #075d2d; background: #e8fff1; padding: .8rem; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Login</h1>

    {% if mensagem %}<p class="sucesso" role="status">{{ mensagem }}</p>{% endif %}
    {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}

    <form method="post" action="{{ url_for('login') }}">
        <label>E-mail institucional
            <input type="email" name="email" required autocomplete="email">
        </label>
        <label>Senha
            <input type="password" name="senha" required autocomplete="current-password">
        </label>
        <button type="submit">Entrar</button>
    </form>

    <p><a href="{{ url_for('index') }}">Voltar ao cadastro</a></p>
</body>
</html>
