<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login</title>
    </head>
    <body style="font-family:system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem">
        <h1>Login</h1>{% if mensagem %}<p role="status">{{ mensagem }}</p>{% endif %}
        <p>O cadastro foi processado.</p>
        <form> 
            <label>E-mail institucional 
                <input type="email" name="email">
            </label><br><br>
            <label>Senha 
                <input type="password" name="senha"></label><br><br>
            <button type="button" disabled>Entrar (não implementado)</button>
        </form>
        <p><a href="/">Voltar ao cadastro</a></p>
    </body>
</html>
